name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q src scripts
      - run: bash -n scripts/bootstrap_vast.sh
      - run: pytest -q --junitxml=validation/pytest.xml
      - name: Package tested source
        if: success()
        run: |
          mkdir -p validation
          git archive --format=zip --prefix=PixelPilot/ --output=validation/PixelPilot-source.zip HEAD
          git rev-parse HEAD > validation/commit.txt
      - name: Retain validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelpilot-validation-${{ github.run_id }}-${{ matrix.python-version }}
          path: validation/
          if-no-files-found: ignore
          retention-days: 7
