[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelpilot"
version = "0.4.2"
description = "Owner-only Telegram assistant that rents economical Vast.ai GPUs for Qwen2.5-Omni text, image and audio understanding"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "vastai==1.6.0",
  "huggingface_hub>=0.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
pixelpilot = "pixelpilot.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
