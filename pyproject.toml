[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelpilot"
version = "1.1.0"
description = "Owner-only Telegram image studio using Qwen-Image-2.1 on temporary Vast.ai GPUs"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.31,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "vastai==1.6.0",
  "huggingface_hub>=0.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
pixelpilot = "pixelpilot.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
